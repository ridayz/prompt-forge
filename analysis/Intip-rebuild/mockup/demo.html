<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Intip-Rebuild</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="notch-wrap" id="notchWrap">
    <div class="notch themed" id="notch" data-state="idle" data-idle="jam" tabindex="0" aria-label="Notch">
      <div class="clip">

        <!-- Kecil: info hidup di kiri, kepala di kanan -->
        <div class="layer idle-layer">
          <div class="idle-info" id="idleInfo" data-live="clock">
            <span class="live l-clock" id="idleClock">--:--</span>
            <span class="live l-music" id="idleSong"><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span><b id="idleMusicClock">--:--</b></span>
          </div>
          <!-- gaya "Mata": dua mata logo yang melirik ke kursor -->
          <span class="idle-eyes" aria-hidden="true"><svg viewBox="0 0 40 20"><g class="ie-look"><ellipse cx="13" cy="10" rx="3.6" ry="4.8"/><ellipse cx="27" cy="10" rx="3.6" ry="4.8"/></g></svg></span>
        </div>

        <!-- Sapaan: tulisan tangan + kepala -->
        <div class="layer greet-layer">
          <div class="greet-line"><div id="greetText"></div></div>
        </div>

        <!-- Terbuka: satu widget per slide -->
        <div class="layer open-layer">
          <header class="o-head">
            <div class="o-hello">
              <span class="o-name"><span id="oHello">Halo</span></span>
              <span id="oDate">—</span>
            </div>
            <div class="o-tools">
              <span class="batt" id="batt" title="Baterai">
                <svg viewBox="0 0 26 14" aria-hidden="true"><rect x="1" y="1" width="21" height="12" rx="3.5" class="shell"/><rect x="3" y="3" width="17" height="8" rx="2" class="fill" id="battFill"/><path d="M24 5v4" class="nub"/></svg>
                <span id="battText">—</span>
              </span>
              <b class="o-time" id="oTime">--:--</b>
              <button type="button" class="nav" id="oSettings" aria-label="Pengaturan">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.98-.45 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.98.45l-.06.06a1.65 1.65 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .45-1.98 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.45-1.98l-.06-.06a1.65 1.65 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.98.45h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.98-.45l.06-.06a1.65 1.65 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.45 1.98v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
              </button>
            </div>
          </header>

          <div class="o-body">
            <button type="button" class="nav" id="slPrev" aria-label="Widget sebelumnya">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6l-6 6 6 6"/></svg>
            </button>
            <div class="slides" id="slides">

              <section class="slide s-music on" data-name="Musik">
                <div class="w-ico">
                  <svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>
                </div>
                <div class="w-main">
                  <span class="w-title" id="mTitle">Belum ada lagu</span>
                  <div class="m-bar-row">
                    <div class="rail" id="mBar"><i id="mFill"></i></div>
                    <span class="w-sub" id="mTime">0:00</span>
                  </div>
                </div>
                <div class="m-ctrl">
                  <button type="button" class="nav" id="mPrev" aria-label="Lagu sebelumnya">
                    <svg viewBox="0 0 24 24"><path d="M6 6h2.2v12H6zM9.5 12L18 18V6z"/></svg>
                  </button>
                  <button type="button" class="nav play" id="mPlay" aria-label="Putar">
                    <svg viewBox="0 0 24 24"><path d="M8.5 6.2v11.6c0 .8.9 1.3 1.6.8l8.6-5.8a1 1 0 0 0 0-1.6L10.1 5.4c-.7-.5-1.6 0-1.6.8z"/></svg>
                  </button>
                  <button type="button" class="nav" id="mNext" aria-label="Lagu berikutnya">
                    <svg viewBox="0 0 24 24"><path d="M15.8 6H18v12h-2.2zM14.5 12L6 18V6z"/></svg>
                  </button>
                </div>
              </section>

              <section class="slide s-pomo" data-name="Pomodoro">
                <div class="w-ico">
                  <svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5"/><path d="M9 2h6"/></svg>
                </div>
                <div class="w-main">
                  <span class="w-title">Fokus</span>
                  <span class="w-value" id="pomoTime">25:00</span>
                  <div class="rail"><i id="pomoFill" style="width:0%"></i></div>
                </div>
                <button type="button" class="nav" id="pomoPlay" aria-label="Mulai">
                  <svg viewBox="0 0 24 24"><path d="M8.5 6.2v11.6c0 .8.9 1.3 1.6.8l8.6-5.8a1 1 0 0 0 0-1.6L10.1 5.4c-.7-.5-1.6 0-1.6.8z"/></svg>
                </button>
              </section>

              <section class="slide s-sholat" data-name="Sholat">
                <div class="w-ico">
                  <svg viewBox="0 0 24 24"><path d="M19 14.5A7.5 7.5 0 1 1 10 4.6a6 6 0 0 0 9 9.9z"/></svg>
                </div>
                <div class="w-main">
                  <span class="w-title">Sholat · <span id="shCity">Jakarta</span></span>
                  <span class="w-value" id="shLeft">—</span>
                  <span class="w-sub" id="shNext">menuju —</span>
                </div>
              </section>

              <section class="slide s-todo" data-name="Tugas">
                <div class="w-ico">
                  <svg viewBox="0 0 24 24"><path d="M9 11.5l2 2 4.5-4.5"/><rect x="4" y="4" width="16" height="16" rx="3"/></svg>
                </div>
                <div class="w-main">
                  <span class="w-title">Tugas</span>
                  <span class="w-value" id="tdCount">0</span>
                  <span class="w-sub">Belum ada tugas</span>
                </div>
              </section>

              <section class="slide s-water" data-name="Minum">
                <div class="w-ico">
                  <svg viewBox="0 0 24 24"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg>
                </div>
                <div class="w-main">
                  <span class="w-title">Minum</span>
                  <span class="w-value"><span id="waterNow">6</span> / <span id="waterGoal">8</span> gelas</span>
                  <div class="rail"><i id="waterFill" style="width:0%"></i></div>
                </div>
                <button type="button" class="nav" id="waterAdd" aria-label="Tambah gelas">
                  <svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg>
                </button>
              </section>

              <section class="slide s-alarm" data-name="Alarm">
                <div class="w-ico">
                  <svg viewBox="0 0 24 24"><path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg>
                </div>
                <div class="w-main">
                  <span class="w-title">Alarm</span>
                  <span class="w-value" id="alarmTime">07:00</span>
                  <span class="w-sub" id="alarmNote">mati</span>
                </div>
                <button type="button" class="nav" id="alarmSwitch" role="switch" aria-checked="false" aria-label="Alarm">
                  <svg viewBox="0 0 24 24"><path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15z"/></svg>
                </button>
              </section>

              <section class="slide s-notif" data-name="Notif">
                <div class="w-ico">
                  <svg viewBox="0 0 24 24"><path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15z"/></svg>
                </div>
                <div class="w-main">
                  <span class="w-title">Notifikasi</span>
                  <span class="w-sub" id="nfBody">Tidak ada notifikasi</span>
                </div>
              </section>

            </div>
            <button type="button" class="nav" id="slNext" aria-label="Widget berikutnya">
              <svg viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></svg>
            </button>
          </div>
          <div class="dots" id="dots" role="tablist" aria-label="Widget"></div>
        </div>

        <div class="head" id="head"></div>
      </div>
    </div>
  </div>

  <!-- Dock bawah: Start | timer | separator | status (wifi, volume, baterai, cuaca, jam) — gaya sama dengan notch -->
  <div class="dock-wrap show" id="dockWrap">
    <nav class="dock themed" id="dock" aria-label="Dock">
      <button type="button" class="dk-w dk-start" id="dkStart" aria-label="Start dan cari">
        <svg viewBox="0 0 24 24"><path d="M4 5h7v7H4zM12.5 5H20v7.5h-8.5zM4 12.5h7.5V20H4zM12.5 13.5H20V20h-7.5z"/></svg>
      </button>
      <button type="button" class="dk-w dk-timer" id="dkTimer" aria-label="Timer">
        <b id="dkTimerTime">--:--</b><span id="dkTimerSub">—</span>
      </button>
      <i class="dk-sep" aria-hidden="true"></i>
      <div class="dk-apps" id="dkApps"></div>
      <i class="dk-sep" aria-hidden="true"></i>
      <div class="dk-status">
        <button type="button" class="dk-st" id="dkWifi" aria-label="Wi-Fi">
          <svg viewBox="0 0 24 24"><path d="M2 8.8a15 15 0 0 1 20 0M5.5 12.3a12 12 0 0 1 15 0M8.5 15.9a6 6 0 0 1 7 0"/><circle cx="12" cy="18.5" r="1.4"/></svg>
        </button>
        <button type="button" class="dk-st" id="dkVol" aria-label="Volume">
          <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>
        </button>
        <span class="dk-st st-bat" id="dkBat">
          <svg viewBox="0 0 26 14"><rect x="1" y="1" width="21" height="12" rx="3.5" class="shell"/><rect x="3" y="3" width="17" height="8" rx="2" class="fill" id="dkBatFill"/><path d="M24 5v4" class="nub"/></svg>
          <span id="dkBatText">—</span>
        </span>
        <span class="dk-st st-wx" id="dkWx"><span id="dkWxIco">⛅</span><b id="dkWxTemp">—</b></span>
        <span class="dk-st dk-time"><b id="dkTimeHm">--:--</b><span id="dkTimeDate">--</span></span>
      </div>
    </nav>
  </div>

  <script src="overlay.js"></script>
</body>
</html>
